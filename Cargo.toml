[package]
name = "zcash-viewing-key"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bip39 = { version = "3.0.0", features = ["zeroize"] }
rpassword = "7.4.0"
zcash_keys = { package = "zakura-keys", version = "3.0.0", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { package = "zakura-protocol", version = "3.0.0" }
zip32 = "0.2.1"
zeroize = "1.8.2"

